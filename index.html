<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programación TV - Marca</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; margin-top: 0; color: #ff0000; } /* Un toque rojo por Marca */
        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 24px;
            background-color: #ff0000; /* Botón rojo Marca */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            width: 100%;
        }
        button:hover { background-color: #cc0000; }
        .loader { display: none; text-align: center; color: #aaa; margin-bottom: 20px; }
        .result-card {
            background-color: #2c2c2c;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #ff0000;
        }
        .event-text {
            font-size: 1.05em;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📅 Programación Deportiva</h2>
        <div class="search-box">
            <button onclick="extraer()">Extraer Eventos de Marca TV</button>
        </div>
        
        <div id="loader" class="loader">Consultando Marca.com, por favor espera...</div>
        <div id="resultados"></div>
    </div>

    <script>
        async function extraer() {
            const loader = document.getElementById('loader');
            const contenedorResultados = document.getElementById('resultados');
            
            contenedorResultados.innerHTML = "";
            loader.style.display = "block";

            try {
                // Llama a la API (FastAPI) de la ruta /extraer
                const respuesta = await fetch('/extraer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // Enviamos un JSON con la estructura que espera tu backend (aunque no se use la URL)
                    body: JSON.stringify({ url: "https://www.marca.com/programacion-tv.html" }) 
                });

                const datos = await respuesta.json();
                loader.style.display = "none";

                if(respuesta.ok) {
                    if(datos.enlaces.length === 0) {
                        contenedorResultados.innerHTML = "<p style='text-align:center; color:#aaa;'>No se encontraron eventos en este momento.</p>";
                        return;
                    }
                    
                    datos.enlaces.forEach(evento => {
                        // Limpiamos un poco el texto por si hay barras dobles
                        const textoLimpio = evento.titulo.replace(/\| \|/g, '|').trim();
                        
                        contenedorResultados.innerHTML += `
                            <div class="result-card">
                                <div class="event-text">
                                    <strong>${textoLimpio}</strong>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    alert("Error del servidor: " + datos.detail);
                }
            } catch (error) {
                loader.style.display = "none";
                alert("Fallo de conexión: " + error.message);
                console.error("Detalle completo del error:", error);
            }
        }
    </script>
</body>
</html>
